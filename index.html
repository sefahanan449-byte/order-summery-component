<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Summary Component</title>

    
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen w-full flex items-center justify-center bg-[#e0e8ff] p-6 font-sans">
t
    
    <main class="mx-auto w-full max-w-[400px] overflow-hidden rounded-[20px] bg-white text-center shadow-xl">

        
        <img
            src="./images/illustration-hero.svg"
            alt="Person listening to music"
            class="block w-full"
        >

        
        <div class="p-8 max-sm:p-6">

            
            <h1 class="mb-4 text-2xl font-black text-[#1f2f56]">
                Order Summary
            </h1>

            
            <p class="mb-6 text-base leading-relaxed text-[#7280a7]">
                You can now listen to millions of songs, audiobooks,
                and podcasts on any device anywhere you like!
            </p>

            
            <div class="mb-6 flex items-center gap-4 rounded-xl bg-[#f5f7ff] p-4">

                
                <img
                    src="./images/icon-music.svg"
                    alt="Music icon"
                    class="h-12 w-12"
                >

              
                <div class="min-w-0 flex-1 text-left">

                    <h2 class="text-sm font-black text-[#1f2f56]">
                        Annual Plan
                    </h2>

                    <p class="mt-1 text-sm text-[#7280a7]">
                        $59.99/year
                    </p>

                </div>

                
                <a
                    href="#"
                    class="text-sm font-bold text-[#3829e0] underline hover:text-[#766cf1] hover:no-underline"
                >
                    Change
                </a>

            </div>

            
            <button
                type="button"
                class="w-full rounded-xl bg-[#3829e0] px-4 py-4 text-sm font-bold text-white shadow-lg transition duration-200 hover:bg-[#766cf1] focus:outline-none focus:ring-2 focus:ring-[#766cf1] focus:ring-offset-2"
            >
                Proceed to Payment
            </button>

            
            <a
                href="#"
                class="mt-6 inline-block text-sm font-black text-[#7280a7] transition hover:text-[#1f2f56]"
            >
                Cancel Order
            </a>

        </div>

    </main>

</body>

</html>
